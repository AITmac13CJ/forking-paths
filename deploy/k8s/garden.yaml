apiVersion: v1
kind: Service
metadata:
  name: garden
  namespace: default
spec:
  ports:
    - name: http
      port: 8091
      targetPort: 8091
---
apiVersion: v1
kind: Endpoints
metadata:
  name: garden
  namespace: default
subsets:
  - addresses:
      - ip: 10.0.0.4
    ports:
      - name: http
        port: 8091
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garden
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  rules:
    - host: atimac13cj.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garden
                port:
                  number: 8091
    - host: www.atimac13cj.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garden
                port:
                  number: 8091
  tls:
    - hosts:
        - atimac13cj.com
        - www.atimac13cj.com
